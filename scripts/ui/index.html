<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<!-- momos-ui:4 -->
<title>MOMOS — web ui</title>
<!--
  The chat page for `momos ui`.

  Deliberately self-contained: no external stylesheet, font or script. It is
  served off a phone that may have no network of its own, so anything fetched
  from a CDN would be the one thing on the page that fails. That is also why
  the Markdown renderer below is hand-written rather than a library.

  The server it talks to is Ollama on this same device, reached at the address
  this browser actually dialled. That is the whole trick: open the page on the
  phone and it dials loopback, open it from a laptop and it dials the phone's
  address on the Wi-Fi, and neither needs configuring.

  Saved chats live in this browser's localStorage, not on the phone. The page is
  served by a static file server, so there is nowhere for it to write: the phone
  has no endpoint to post a chat to, and giving it one would mean another
  process competing with the model for the phone's memory. The cost is that the
  laptop's chats and the phone's chats are separate, and clearing site data
  clears them — which is what the notice on the page says.

  Two blocks in here are lifted out and run under node by the test suite, and
  the markers around them are what the tests look for. Everything between
  `--- store:begin ---` and `--- store:end ---` must stay free of the DOM, and
  everything between `--- markdown:begin ---` and `--- markdown:end ---` must
  build through the element factory it is handed rather than a global. Move a
  marker and the test that reads it finds an empty block.

  The page is drawn as one full-height app: a rail of chats on the left and a
  column of conversation on the right, each scrolling on its own. Monospace and
  the phosphor palette carry the chrome — the rail, the chrome, the code — and
  message prose is set in the system sans, because a paragraph of monospace is
  the one thing on this page that is genuinely hard to read.

  The `momos-ui:` marker above is a version stamp. The launcher and installer
  look for it to decide whether the copy on the device is current, so it must
  stay, and its number must match UI_VERSION in scripts/momos.sh.
-->
<style>
  :root {
    --paper:     #070b0e;  /* unlit tube */
    --rail:      #090e12;  /* the sidebar, a shade behind the page */
    --panel:     #0c1317;
    --code:      #05090b;
    --line:      #1e2c31;
    --text:      #c6d4d2;
    --muted:     #7d8e92;  /* the DIM attribute */
    --faint:     #5c6c70;  /* the rail's second line */
    --phosphor:  #6fe3d2;  /* ANSI cyan */
    --amber:     #e8b75c;  /* ANSI yellow, used once */

    /* Two families, deliberately different: the mono is the machine talking —
       the rail, the chrome, code, your own words — and the sans is the part
       you actually read. Neither is fetched; both are whatever the device
       already has, which is the only honest choice offline. */
    --mono: ui-monospace, "SF Mono", "Roboto Mono", "DejaVu Sans Mono",
            Menlo, Consolas, "Liberation Mono", monospace;
    --prose: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, sans-serif;

    --t-xs:   0.72rem;   /* rail metadata */
    --t-sm:   0.8rem;    /* chrome: buttons, status, notices */
    --t-md:   0.9375rem; /* prose */
    --t-code: 0.82rem;

    --rail-col: 15rem;
    /* Under 80 characters, and a shade under the 68ch a proportional face
       wants, because this column also has to hold code and tables. */
    --measure: 66ch;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: var(--prose);
    font-size: var(--t-md);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    /* The two panes scroll, not the page. A chat that scrolls the whole window
       takes the composer off the bottom of the screen with it. */
    overflow: hidden;
  }

  .app {
    height: 100vh;
    height: 100dvh;
    display: grid;
    grid-template-columns: var(--rail-col) minmax(0, 1fr);
  }

  /* ---------------------------------------------------------------------
     The rail: everything you can switch to.
     --------------------------------------------------------------------- */

  .chats {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--rail);
    border-right: 1px solid var(--line);
    font-family: var(--mono);
  }

  .chats-head {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.8rem 0.7rem 0.8rem 0.95rem;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    /* The tracking pushes the last letter off-centre; pull it back. */
    margin-right: -0.24em;
    color: var(--phosphor);
  }

  .chats-count {
    font-size: var(--t-xs);
    color: var(--faint);
    /* Sits against the wordmark rather than floating between the two controls,
       so it reads as part of the title. */
    margin-left: -0.3rem;
  }

  .chats-new {
    margin-left: auto;
    flex: none;
    font: inherit;
    font-size: var(--t-xs);
    letter-spacing: 0.04em;
    color: var(--phosphor);
    background: transparent;
    border: 1px solid var(--line);
    padding: 0.2rem 0.5rem;
    cursor: pointer;
  }

  .chats-new:hover:not(:disabled) { border-color: var(--phosphor); }

  .chats-new:disabled { color: var(--muted); cursor: default; }

  .chats-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .chat-list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 0.3rem 0;
    font-size: var(--t-sm);
  }

  .chat-row { display: flex; align-items: stretch; }

  .chat-row.active { box-shadow: inset 2px 0 0 var(--phosphor); }

  .chat-open {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: var(--t-sm);
    text-align: left;
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 0.4rem 0.6rem 0.45rem 0.95rem;
    cursor: pointer;
    line-height: 1.4;
    /* A title is one line by construction, so it can be cut with an ellipsis
       rather than wrapping and making the rows uneven heights. */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* The second line of a row — when you last said something in it. It is drawn
     by the stylesheet from an attribute rather than written into the button,
     so the button still holds the title and nothing else: the title is what
     the page tests read back, and what a screen reader announces. */
  .chat-open[data-when]::after {
    content: attr(data-when);
    display: block;
    font-size: var(--t-xs);
    letter-spacing: 0.04em;
    color: var(--faint);
  }

  .chat-open:hover:not(:disabled) { color: var(--text); }

  .chat-row.active .chat-open { color: var(--phosphor); }

  .chat-open:disabled { cursor: default; }

  .chat-del {
    flex: none;
    font: inherit;
    font-size: var(--t-sm);
    color: var(--muted);
    background: transparent;
    border: 0;
    padding: 0 0.6rem;
    cursor: pointer;
    /* Hidden until the row is pointed at, so the list reads as titles. A phone
       has no hover, so there it is always visible — an affordance you cannot
       reach is worse than a busy row. */
    opacity: 0;
  }

  .chat-row:hover .chat-del, .chat-del:focus-visible { opacity: 1; }

  .chat-del:hover:not(:disabled) { color: var(--amber); }

  @media (hover: none) {
    .chat-del { opacity: 1; }
  }

  .chats-empty {
    margin: 0;
    padding: 0.2rem 0.95rem 0.7rem;
    font-size: var(--t-xs);
    color: var(--faint);
  }

  .chats-empty[hidden] { display: none; }

  /* The scrim goes with the drawer, and is a sibling so the stylesheet can
     reach it from the rail's own open state. */
  .scrim { display: none; }

  /* ---------------------------------------------------------------------
     The column: the conversation.
     --------------------------------------------------------------------- */

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    padding: 0.55rem 0.85rem;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .chats-toggle {
    display: none;
    flex: none;
    font: inherit;
    font-family: var(--mono);
    font-size: var(--t-sm);
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    padding: 0.4rem 0.5rem;
    cursor: pointer;
  }

  .chats-toggle:hover { color: var(--text); border-color: var(--phosphor); }

  .chat-title {
    flex: 1 1 6rem;
    min-width: 0;
    margin: 0;
    font-family: var(--prose);
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: -0.008em;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Sized to the longest model tag rather than to the room left over. A select
     stretched across half a laptop screen puts its arrow at the far right edge,
     a hand's width from the name it belongs to. */
  .model-pick {
    flex: 0 1 22rem;
    display: flex;
    align-items: stretch;
    gap: 0.35rem;
    min-width: 0;
  }

  .model-pick select {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-family: var(--mono);
    font-size: var(--t-xs);
    color: var(--text);
    background: var(--paper);
    border: 1px solid var(--line);
    padding: 0.3rem 0.4rem;
  }

  .model-pick select:focus { outline: none; border-color: var(--phosphor); }

  .model-pick select:disabled { color: var(--muted); }

  .icon {
    flex: none;
    font: inherit;
    font-family: var(--mono);
    font-size: var(--t-xs);
    color: var(--phosphor);
    background: transparent;
    border: 1px solid var(--line);
    padding: 0 0.55rem;
    cursor: pointer;
  }

  .icon:hover:not(:disabled) { border-color: var(--phosphor); }

  .icon:disabled { color: var(--muted); cursor: default; }

  .notice {
    margin: 0;
    padding: 0.6rem 0.95rem;
    border-bottom: 1px solid var(--line);
    background: rgba(232, 183, 92, 0.06);
    font-family: var(--mono);
    font-size: var(--t-xs);
    line-height: 1.55;
    color: var(--muted);
    /* Each warning is its own line; they are stacked rather than replaced so a
       second reason the page is degraded cannot hide the first. */
    white-space: pre-line;
  }

  .notice strong { color: var(--amber); font-weight: 600; }

  .notice[hidden] { display: none; }

  .log-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  .log {
    display: flex;
    flex-direction: column;
    gap: 1.3rem;
    max-width: var(--measure);
    margin: 0 auto;
    padding: 1.6rem 1.1rem 2.2rem;
  }

  /* Written on one line in the markup precisely so this matches: whitespace
     inside the element would count as content and the rule would never fire. */
  .log:empty { padding-top: 0; padding-bottom: 0; }

  .turn { display: block; }

  /* A shell prompt for what you typed. Drawn by the stylesheet rather than
     written into the text, so it can never be sent to the model as part of your
     message. It is unselectable as well, or selecting your own message to copy
     it back out would paste the prompt along with it. */
  .turn.user .md.plain::before {
    content: "> ";
    color: var(--phosphor);
    -webkit-user-select: none;
    user-select: none;
  }

  /* Your words in the mono, the model's in the sans. The asymmetry is the
     point: one side is a terminal line, the other is something to read. */
  .turn.user .md.plain {
    font-family: var(--mono);
    font-size: 0.875rem;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* The reply, marked with the same left rule the notice uses. */
  .turn.assistant .body {
    border-left: 2px solid var(--line);
    padding-left: 1rem;
  }

  .body.failed { border-left-color: var(--amber); }
  .body.failed .md { color: var(--amber); white-space: pre-wrap; }

  /* DeepSeek R1 and friends stream their working-out in a separate field. It
     is folded away and dimmed because it is reasoning, not the reply — but it
     has to be shown, or those models look like a long silence followed by an
     answer that came from nowhere. It is not saved with a chat: the folds are
     read once, and keeping them would multiply the storage several times over
     for something already scrolled past. */
  .think {
    margin: 0 0 0.7rem;
    padding-left: 1rem;
    border-left: 2px solid var(--line);
    font-family: var(--mono);
    font-size: var(--t-xs);
    line-height: 1.6;
    color: var(--muted);
  }

  .think summary { cursor: pointer; list-style: none; }

  .think summary::-webkit-details-marker { display: none; }

  .think summary::before { content: "▸ "; }

  .think[open] summary::before { content: "▾ "; }

  .think pre {
    margin: 0.45rem 0 0;
    font: inherit;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* ---------------------------------------------------------------------
     What the model wrote back.
     --------------------------------------------------------------------- */

  .md { overflow-wrap: anywhere; }

  .md > *:first-child { margin-top: 0; }

  .md > *:last-child { margin-bottom: 0; }

  .md p { margin: 0 0 0.85em; }

  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 1.35em 0 0.5em;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.008em;
    color: #dbe8e6;
  }

  .md h1 { font-size: 1.25rem; }
  .md h2 { font-size: 1.12rem; }
  .md h3 { font-size: 1rem; }
  .md h4, .md h5, .md h6 { font-size: 0.94rem; color: var(--text); }

  /* Headings the model wrote are structure inside one reply, so they step down
     from the reply itself rather than competing with the page title above. */

  .md ul, .md ol { margin: 0 0 0.85em; padding-left: 1.35em; }

  .md li { margin: 0.15em 0; }

  .md li > ul, .md li > ol { margin: 0.15em 0; }

  .md li::marker { color: var(--faint); }

  .md-task {
    list-style: none;
    /* Pulled back out of the list's padding so the box lines up with the
       markers of the items around it. */
    margin-left: -1.35em;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
  }

  .md-task input {
    flex: none;
    margin: 0;
    accent-color: var(--phosphor);
  }

  .md blockquote {
    margin: 0 0 0.85em;
    padding-left: 1rem;
    border-left: 2px solid var(--line);
    color: var(--muted);
  }

  .md hr {
    margin: 1.4em 0;
    border: 0;
    border-top: 1px solid var(--line);
  }

  .md-code {
    margin: 0 0 1em;
    padding: 0.7rem 0.85rem;
    background: var(--code);
    border: 1px solid var(--line);
    overflow-x: auto;
    font-family: var(--mono);
    font-size: var(--t-code);
    line-height: 1.55;
    color: var(--text);
    tab-size: 4;
  }

  .md-code code { font: inherit; white-space: pre; }

  /* The language, likewise drawn from an attribute rather than written into
     the block — so the code is still only the code, and copying it does not
     paste the label in among the first line. */
  .md-code[data-lang]::before {
    content: attr(data-lang);
    display: block;
    margin-bottom: 0.5rem;
    font-size: var(--t-xs);
    letter-spacing: 0.1em;
    color: var(--faint);
    -webkit-user-select: none;
    user-select: none;
  }

  .md-ic {
    padding: 0.08em 0.32em;
    font-family: var(--mono);
    font-size: 0.86em;
    color: var(--phosphor);
    background: var(--code);
    border: 1px solid var(--line);
  }

  .md a {
    color: var(--phosphor);
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 0.18em;
  }

  .md strong { font-weight: 600; color: #dbe8e6; }

  .md del { color: var(--muted); }

  .md table {
    margin: 0 0 1em;
    border-collapse: collapse;
    font-size: 0.88em;
  }

  .md th, .md td {
    padding: 0.3rem 0.6rem;
    border: 1px solid var(--line);
    text-align: left;
  }

  .md th { background: var(--panel); font-weight: 600; color: #dbe8e6; }

  /* What is on screen before anyone has said anything. It is a sibling of the
     log, not inside it: the log has to stay empty for the page tests to read
     a cleared conversation as cleared. */
  .empty {
    max-width: var(--measure);
    margin: 0 auto;
    padding: 2.6rem 1.1rem 0;
  }

  .empty[hidden] { display: none; }

  .empty p {
    margin: 0;
    max-width: 44ch;
    font-size: 0.9rem;
    color: var(--muted);
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 0.5rem;
    width: calc(100% - 2.2rem);
    max-width: var(--measure);
    margin: 0 auto;
    padding: 0.55rem 0.55rem 0.55rem 0.8rem;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  /* The box lights up rather than the textarea drawing its own outline, which
     would sit awkwardly inside the border. */
  .composer:focus-within { border-color: var(--phosphor); }

  .composer textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.9rem;
    line-height: 1.5;
    max-height: 40vh;
  }

  .composer textarea::placeholder { color: var(--faint); }

  .composer textarea:focus { outline: none; }

  .composer button {
    flex: none;
    font: inherit;
    font-family: var(--mono);
    font-size: var(--t-xs);
    color: var(--phosphor);
    background: transparent;
    border: 1px solid var(--line);
    padding: 0.4rem 0.8rem;
    cursor: pointer;
  }

  .composer button:hover:not(:disabled) { border-color: var(--phosphor); }

  .composer button:disabled { color: var(--muted); cursor: default; }

  .composer button[hidden] { display: none; }

  .status {
    width: calc(100% - 2.2rem);
    max-width: var(--measure);
    margin: 0.4rem auto 0.7rem;
    min-height: 1.2em;
    font-family: var(--mono);
    font-size: var(--t-xs);
    color: var(--muted);
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  :focus-visible {
    outline: 2px solid var(--phosphor);
    outline-offset: 3px;
  }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    margin-left: 0.2em;
    background: var(--phosphor);
    vertical-align: text-bottom;
    animation: blink 1.15s step-end infinite;
  }

  @keyframes blink {
    0%, 60%   { opacity: 1; }
    61%, 100% { opacity: 0; }
  }

  /* On a phone the rail is a drawer over the conversation. A drawer, not a
     panel above it: the list is the thing you switch with, and giving it the
     top third of a phone screen costs more than it returns. */
  @media (max-width: 60rem) {
    .app { grid-template-columns: minmax(0, 1fr); }

    .chats {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      width: min(19rem, 84vw);
      transform: translateX(-100%);
      transition: transform 0.18s ease;
    }

    .chats.open { transform: none; }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 9;
      background: rgba(0, 0, 0, 0.55);
    }

    .chats.open + .scrim { display: block; }

    .chats-toggle { display: block; }

    /* The picker takes its own row rather than being squeezed against the
       title, which on a phone would leave neither of them readable. */
    .model-pick { flex-basis: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .chats { transition: none; }
    .cursor { animation: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- The rail. On a phone it is the drawer; on anything wider it is the
         left column and is always there. Either way it is first in the
         document, so tabbing reaches the list before the conversation. -->
    <nav class="chats" id="chats" aria-label="Saved chats">
      <div class="chats-head">
        <span class="brand">MOMOS</span>
        <span class="chats-count" id="chats-label"></span>
        <button type="button" class="chats-new" id="new-chat">+ new</button>
      </div>
      <!-- Outside the scrolling list on purpose. Inside it, an empty rail would
           float the line to the bottom of a tall void, a long way from the
           heading it belongs to. -->
      <p class="chats-empty" id="chats-empty">no saved chats</p>
      <div class="chats-body" id="chats-body">
        <ul class="chat-list" id="chat-list"></ul>
      </div>
    </nav>

    <!-- The drawer's backdrop. A sibling of the rail so the sheet can reach it
         from the rail's own open state, with no script involved. -->
    <div class="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button type="button" class="chats-toggle" id="chats-toggle"
                aria-expanded="false" aria-controls="chats-body"
                aria-label="Saved chats">☰</button>
        <h1 class="chat-title" id="chat-title">New chat</h1>
        <div class="model-pick">
          <label class="sr-only" for="model">Model</label>
          <select id="model"></select>
          <button type="button" class="icon" id="reload-models"
                  title="Reload the model list"
                  aria-label="Reload the model list">↻</button>
        </div>
      </header>

      <p class="notice" id="banner" hidden></p>

      <div class="log-wrap" id="log-wrap">
        <!-- aria-live is off on the log on purpose. A polite live region over a
             token-by-token stream reads every fragment aloud, which is
             unusable. Arrivals and state changes are announced through #status
             instead. Written as one line so the stylesheet's `:empty` rule can
             match it. -->
        <div class="log" id="log" role="log" aria-live="off" aria-label="Conversation"></div>

        <div class="empty" id="empty" hidden>
          <p>Nothing here yet. Type below to start a chat.</p>
        </div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="prompt">Message</label>
        <textarea id="prompt" rows="1" spellcheck="false"
                  placeholder="ask something"></textarea>
        <button type="submit" id="send">Send</button>
        <button type="button" id="stop" hidden>Stop</button>
      </form>

            i++;
            // An unterminated fence takes everything left. That is what a reply
            // mid-stream looks like, and it is also what a model that forgot to
            // close one means.
            while (i < lines.length && !closeRe.test(lines[i])) { body.push(lines[i]); i++; }
            if (i < lines.length) i++;
            var pre = mk.createElement('pre');
            pre.className = 'md-code';
            if (fence[2]) pre.setAttribute('data-lang', fence[2]);
            var codeEl = mk.createElement('code');
            codeEl.appendChild(mk.createTextNode(body.join('\n')));
            pre.appendChild(codeEl);
            parent.appendChild(pre);
            continue;
          }

          head = /^ {0,3}(#{1,6})(?:[ \t]+(.*))?$/.exec(line);
          if (head) {
            lvl = head[1].length;
            htext = (head[2] || '').replace(/[ \t]+#+[ \t]*$/, '');
            h = mk.createElement('h' + lvl);
            mdInline(htext, mk, h);
            parent.appendChild(h);
            i++;
            continue;
          }

          if (/^ {0,3}([-*_])[ \t]*(\1[ \t]*){2,}$/.test(line)) {
            hr = mk.createElement('hr');
            parent.appendChild(hr);
            i++;
            continue;
          }

          if (line.indexOf('|') !== -1 && i + 1 < lines.length && mdDelimRow(lines[i + 1])) {
            i = mdTable(lines, i, mk, parent);
            continue;
          }

          if (/^ {0,3}>/.test(line)) {
            quoted = [];
            while (i < lines.length &&
                   (/^ {0,3}>/.test(lines[i]) ||
                    (/^[ \t]*$/.test(lines[i]) && i + 1 < lines.length &&
                     /^ {0,3}>/.test(lines[i + 1])))) {
              quoted.push(lines[i].replace(/^ {0,3}>[ \t]?/, ''));
              i++;
            }
            bq = mk.createElement('blockquote');
            mdRenderBlocks(quoted, mk, bq);
            parent.appendChild(bq);
            continue;
          }

          if (mdIsList(line)) {
            i = mdList(lines, i, mk, parent);
            continue;
          }

          // A paragraph. The first line is taken unconditionally so the loop
          // below always makes progress, whatever the line turns out to be.
          para = [line];
          i++;
          while (i < lines.length && !/^[ \t]*$/.test(lines[i]) &&
                 !mdStartsBlock(lines, i)) {
            para.push(lines[i]);
            i++;
          }
          p = mk.createElement('p');
          mdInline(para.join('\n'), mk, p);
          parent.appendChild(p);
        }
      }

      function mdToDom(text, mk) {
        var root = mk.createElement('div');
        var lines = String(text == null ? '' : text)
          .replace(/\r\n?/g, '\n')
          .split('\n');
        mdRenderBlocks(lines, mk, root);
        return root;
      }
      // --- markdown:end ---

      var STORE = { current: null, sessions: [] };

      function isLocal(host) {
        return host === 'localhost' || host === '127.0.0.1' ||
               host === '::1' || host === '[::1]';
      }

      // The host comes from the address this browser actually dialled, so the
      // origin the request carries and the origin the server was told to allow
      // always agree. Loopback is spelled 127.0.0.1 rather than localhost: a
      // name that resolves to ::1 first would miss an IPv4-only bind.
      function baseUrl(host, port) {
        return 'http://' + (isLocal(host) ? '127.0.0.1' : host) + ':' + port;
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      // Warnings stack instead of replacing one another: a page can be without a
      // model list and without storage at the same time, and the second reason
      // must not hide the first.
      var warnings = [];

      function warn(text) {
        if (warnings.indexOf(text) === -1) warnings.push(text);
        banner.textContent = warnings.join('\n');
        banner.hidden = false;
      }

      function activeSession() {
        for (var i = 0; i < STORE.sessions.length; i++) {
          if (STORE.sessions[i].id === STORE.current) return STORE.sessions[i];
        }
        return null;
      }

      function findSession(id) {
        for (var i = 0; i < STORE.sessions.length; i++) {
          if (STORE.sessions[i].id === id) return STORE.sessions[i];
        }
        return null;
      }

      // The model a request would go to right now: the open chat's, or the one
      // picked for a chat that has not been started yet.
      function currentModel() {
        var s = activeSession();
        if (s && s.model) return s.model;
        return draftModel || DEFAULT_MODEL;
      }

      function persist() {
        if (!storage) return;
        var dropped = safeSet(storage, STORE);
        if (dropped && dropped.length) {
          warn('Storage is full, so the oldest chats were not saved.');
        }
      }

      // Only follow the reply if you were already at the bottom. Yanking the
      // view down while somebody is reading back through a long answer is the
      // thing that makes a chat page feel like it is fighting you.
      function nearBottom() {
        var gap = wrapEl.scrollHeight - wrapEl.scrollTop - wrapEl.clientHeight;
        return !(gap > 80);   // an unmeasurable pane counts as being at the end
      }

      function scrollToEnd(force) {
        if (!force && !nearBottom()) return;
        wrapEl.scrollTop = wrapEl.scrollHeight;
      }

      function clearNode(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      // Text goes in as a text node, never as markup. Model output reaches the
      // page either through here or through mdToDom, and both of them end in
      // createTextNode — which is why the renderer being wrong can only produce
      // the wrong formatting, never a script.
      function appendText(parent, text) {
        parent.appendChild(document.createTextNode(text));
      }

      function addTurn(role) {
        var turn = document.createElement('article');
        turn.className = 'turn ' + role;

        var body = document.createElement('div');
        body.className = 'body';

        // Everything the turn says lives in here and is replaced wholesale
        // whenever the Markdown is re-rendered.
        var answer = document.createElement('div');
        answer.className = 'md';

        body.appendChild(answer);
        turn.appendChild(body);
        logEl.appendChild(turn);
        renderEmpty();

        return {
          turn: turn, body: body, answer: answer,
          think: null, caret: null, caretOn: false, text: '', failed: false
        };
      }

      function clearLog() {
        while (logEl.firstChild) logEl.removeChild(logEl.firstChild);
        renderEmpty();
      }

      // Before anything has been said. It sits outside the log, because the log
      // has to stay genuinely empty for a cleared conversation to read as one.
      function renderEmpty() {
        emptyEl.hidden = logEl.childNodes.length > 0;
      }

      function renderHead() {
        var s = activeSession();
        chatTitle.textContent = s ? (s.title || 'untitled') : 'New chat';
      }

      // How far into the last block the caret can go before it would land on a
      // line of its own. A caret after a </p> reads as a new paragraph; a caret
      // inside one reads as typing.
      var NO_DESCEND = { HR: 1, TABLE: 1, UL: 1, OL: 1, BLOCKQUOTE: 1 };

      function caretHost(t) {
        var host = t.answer;
        var depth = 0;
        while (depth++ < 6 && host.lastElementChild) {
          var last = host.lastElementChild;
          if (NO_DESCEND[last.tagName]) break;
          host = last;
        }
        return host;
      }

      function paintCaret(t) {
        if (t.caret && t.caret.parentNode) t.caret.parentNode.removeChild(t.caret);
        t.caret = null;
        if (!t.caretOn) return;
        t.caret = document.createElement('span');
        t.caret.className = 'cursor';
        t.caret.setAttribute('aria-hidden', 'true');
        caretHost(t).appendChild(t.caret);
      }

      // Re-render the whole reply from the text so far. Cheap enough to do on
      // every chunk: the parser is one linear pass, and a reply is a few
      // kilobytes. Rebuilding rather than appending is what lets a code fence
      // that starts mid-stream become a code block as soon as it closes.
      //
      // The re-render has to be told where you were first. Emptying a block
      // shortens the pane, and the browser clamps scrollTop to the shorter
      // height as it goes — so by the time the new content is in, "are we at
      // the bottom?" answers itself with the 0 that the rebuild just wrote,
      // and a reply being followed would stop following it on its first chunk.
      function paint(t) {
        var following = nearBottom();
        clearNode(t.answer);
        t.answer.appendChild(mdToDom(t.text, document));
        paintCaret(t);
        if (following) scrollToEnd(true);
      }

      function showCaret(t) {
        t.caretOn = true;
        paintCaret(t);
      }

      function hideCaret(t) {
        t.caretOn = false;
        paintCaret(t);
      }

      // The reasoning fold is created the first time a model actually streams
      // any, so models without one never show an empty box.
      function thinkingSink(t) {
        if (t.think) return t.think;
        var det = document.createElement('details');
        det.className = 'think';
        var sum = document.createElement('summary');
        sum.textContent = 'reasoning';
        var pre = document.createElement('pre');
        det.appendChild(sum);
        det.appendChild(pre);
        t.turn.insertBefore(det, t.body);
        t.think = pre;
        return pre;
      }

      function handleLine(line) {
        line = line.replace(/\r$/, '').trim();
        if (!line) return;

        var obj;
        try {
          obj = JSON.parse(line);
        } catch (e) {
          // A chunk can end mid-line, and the buffer holds the tail until its
          // newline arrives. Anything still unparseable here is skipped rather
          // than abandoning a reply that is otherwise arriving fine.
          return;
        }

        if (obj.error) { failTurn(withHint(String(obj.error))); return; }

        // An error line ends the reply. Anything the server sends afterwards
        // belongs to a turn that is already over.
        if (current.failed) return;

        if (obj.message) {
          if (obj.message.thinking) {
            appendText(thinkingSink(current), obj.message.thinking);
          }
          if (obj.message.content) {
            current.text += obj.message.content;
            paint(current);
          }
          scrollToEnd();
        }

        if (obj.done) hideCaret(current);
      }

      // Ollama declares only a 200 in its spec but does return {"error": ...}
      // in practice — a deleted model, most often — so the body is read rather
      // than assumed empty.
      function serverError(body, status) {
        var msg = '';
        try { msg = JSON.parse(body).error || ''; } catch (e) { msg = ''; }
        if (msg) return withHint(msg);
        return withHint(body.slice(0, 300) || ('HTTP ' + status));
      }

      function withHint(msg) {
        if (currentModel() && /not found|no such|try pulling/i.test(msg)) {
          return msg + '\n\nOn the phone:  momos models pull ' + currentModel();
        }
        return msg;
      }

      // A refused connection and a CORS rejection are indistinguishable from
      // JavaScript — both arrive as a TypeError carrying no status and no
      // message — so the text names both causes instead of guessing at one.
      function describeFailure(err) {
        return 'Could not reach Ollama at ' + BASE + '.\n\n' +
          'Two causes look identical from here, so check both:\n' +
          '  - the server is not exposed to this network.\n' +
          '    On the phone:  momos serve --lan\n' +
          '  - this page\'s origin is not allowed by the server.\n' +
          '    Start it with:  OLLAMA_ORIGINS="http://' + location.hostname + ':*"\n' +
          (err && err.message ? '\nThe browser said: ' + err.message : '');
      }

      function failTurn(msg) {
        if (!current) return;
        hideCaret(current);
        current.failed = true;
        current.text = '';
        current.answer.className = 'md plain';
        current.answer.textContent = msg;
        current.body.className = 'body failed';
        setStatus('failed');
        scrollToEnd(true);
      }

      // The NDJSON reader. Ollama sends one JSON object per line and a chunk
      // boundary can land anywhere, including inside a character, so bytes are
      // decoded in stream mode and only complete lines are consumed.
      function readStream(res) {
        if (!res.ok) {
          return res.text().then(function (body) {
            var err = new Error(serverError(body, res.status));
            // Named, because the catch below has to tell a real answer from
            // the server apart from a connection that never happened: only the
            // latter is worth the OLLAMA_ORIGINS troubleshooting text, and a
            // bare TypeError is all the browser gives us to go on.
            err.name = 'ServerError';
            throw err;
          });
        }

        if (!res.body) {
          // No streaming support: read it whole and replay it line by line.
          return res.text().then(function (all) {
            all.split('\n').forEach(handleLine);
          });
        }

        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        function pump() {
          return reader.read().then(function (chunk) {
            if (chunk.done) {
              // A last line without its trailing newline is normal, not a
              // truncation.
              if (buffer.trim()) handleLine(buffer);
              return;
            }
            buffer += decoder.decode(chunk.value, { stream: true });
            var nl;
            while ((nl = buffer.indexOf('\n')) !== -1) {
              handleLine(buffer.slice(0, nl));
              buffer = buffer.slice(nl + 1);
            }
            return pump();
          });
        }

        return pump();
      }

      // Every control that changes which chat is open is locked while a reply is
      // arriving, because the stream appends to whichever chat is open when the
      // text lands — switching mid-reply would file the answer under the wrong
      // conversation. Stop is always there to take the lock off.
      function setGenerating(busy) {
        generating = busy;
        sendBtn.disabled = busy || !currentModel();
        stopBtn.hidden = !busy;
        newChatBtn.disabled = busy;
        modelSel.disabled = busy || !modelSel.options.length;
        var rows = chatList.getElementsByTagName('button');
        for (var i = 0; i < rows.length; i++) rows[i].disabled = busy;
      }

      function send(text) {
        var session = activeSession();
        if (!session) {
          // The chat is created here rather than when "+ new" is pressed, so a
          // chat you never typed in leaves nothing behind.
          session = { id: newId(), title: '', model: currentModel(),
                      updated: Date.now(), messages: [] };
          STORE.sessions.unshift(session);
          STORE.current = session.id;
        }
        if (!session.model) session.model = currentModel();

        session.messages.push({ role: 'user', content: text });
        session.updated = Date.now();
        if (session.messages.length === 1) session.title = titleFor(text);

        var yours = addTurn('user');
        yours.answer.className = 'md plain';
        yours.answer.textContent = text;

        // Saved before the reply is asked for, so a reload in the middle of a
        // long generation keeps the question. It will look unanswered, because
        // that is what happened.
        persist();
        renderChats();
        syncModelSelect();

        current = addTurn('assistant');
        showCaret(current);
        setGenerating(true);
        setStatus('generating');
        scrollToEnd(true);

        controller = new AbortController();

        fetch(BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: session.model,
            messages: session.messages,
            stream: true,
            keep_alive: '5m'
            // num_ctx is deliberately not set. Raising it multiplies the KV
            // cache, and this server is a phone; the native endpoint is used so
            // that it *can* be set, not because this page sets it.
          }),
          signal: controller.signal
        })
          .then(readStream)
          .catch(function (err) {
            if (err && err.name === 'AbortError') {
              // Stopping is not failing. There is no server-side cancel, so the
              // abort closes the connection, which is what tells ollama to stop.
              setStatus('stopped');
              return;
            }
            failTurn(err && err.name === 'ServerError'
              ? err.message
              : describeFailure(err));
          })
          .then(function () {
            // Runs after success, failure and stop alike. Whatever text did
            // arrive is a real turn, and dropping it would leave the model's
            // context and the screen disagreeing.
            hideCaret(current);
            if (current && current.text) {
              session.messages.push({ role: 'assistant', content: current.text });
              session.updated = Date.now();
              persist();
            }
            current = null;
            controller = null;
            setGenerating(false);
            renderChats();
            renderHead();
            if (statusEl.textContent === 'generating') setStatus('done');
            input.focus();
          });
      }

      function submit() {
        if (generating) return;   // one request at a time
        var text = input.value.trim();
        if (!text || !currentModel()) return;
        input.value = '';
        autosize();
        send(text);
      }

      function autosize() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + 'px';
      }

      // ---- the chat list ----

      function setChatsOpen(open) {
        chatsEl.className = open ? 'chats open' : 'chats';
        chatsToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }

      function updateChatsLabel() {
        var n = STORE.sessions.length;
        chatsLabel.textContent = n ? String(n) : '';
      }

      function chatRow(session) {
        var li = document.createElement('li');
        li.className = session.id === STORE.current ? 'chat-row active' : 'chat-row';

        var title = session.title || 'untitled';

        var open = document.createElement('button');
        open.type = 'button';
        open.className = 'chat-open';
        // The title and nothing else. When the row was last used is carried in
        // an attribute, which the stylesheet draws as a second line.
        open.textContent = title;
        var when = whenLabel(session.updated, Date.now());
        if (when) open.setAttribute('data-when', when);
        // Which chat is open is carried by aria-current rather than by the
        // colour alone, which is the part of it a screen reader can hear.
        if (session.id === STORE.current) open.setAttribute('aria-current', 'true');
        open.title = title + '\n' + (session.model || 'no model') +
          ' · ' + session.messages.length + ' messages';
        open.addEventListener('click', function () { openSession(session.id); });

        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'chat-del';
        del.textContent = '×';
        del.setAttribute('aria-label', 'Delete chat: ' + title);
        del.addEventListener('click', function () { deleteSession(session.id); });

        li.appendChild(open);
        li.appendChild(del);
        return li;
      }

      function renderChats() {
        clearNode(chatList);
        // Sorted here rather than kept sorted: the array is only in recency
        // order until a chat that is already in it is spoken to again, and
        // re-ordering the array on every turn would move rows under the cursor.
        var ordered = byRecency(STORE.sessions);
        for (var i = 0; i < ordered.length; i++) {
          chatList.appendChild(chatRow(ordered[i]));
        }
        chatEmpty.hidden = STORE.sessions.length > 0;
        updateChatsLabel();
        renderHead();
        setGenerating(generating);   // freshly built rows arrive enabled
      }

      // A restored chat shows the question and the reply. It does not show the
      // reasoning folds or the caret, because neither was saved.
      function replay(session) {
        clearLog();
        for (var i = 0; i < session.messages.length; i++) {
          var m = session.messages[i];
          var t = addTurn(m.role === 'user' ? 'user' : 'assistant');
          if (m.role === 'user') {
            t.answer.className = 'md plain';
            t.answer.textContent = m.content;
          } else {
            t.text = m.content;
            paint(t);
          }
        }
        renderEmpty();
        scrollToEnd(true);
      }

      function openSession(id) {
        var session = findSession(id);
        if (!session || generating) return;

        STORE.current = id;
        replay(session);
        persist();
        renderChats();
        syncModelSelect();
        setChatsOpen(false);   // a no-op where the rail is always shown
        setStatus('opened ' + (session.title || 'untitled'));
        input.focus();
      }

      function newChat() {
        if (generating) return;

        var prev = activeSession();
        STORE.current = null;
        clearLog();
        // A new chat inherits the model you were just using: the usual reason to
        // start one is a new subject, not a different model.
        if (prev && prev.model) draftModel = prev.model;

        persist();
        renderChats();
        syncModelSelect();
        setChatsOpen(false);
        setStatus('new chat');
        input.focus();
      }

      function deleteSession(id) {
        var session = findSession(id);
        // The one irreversible thing on this page, so it asks. confirm() is
        // drab and blocking, and that is the point.
        if (!session || generating) return;
        if (!window.confirm('Delete "' + (session.title || 'untitled') + '"?\n\n' +
                            'This cannot be undone.')) {
          return;
        }

        for (var i = 0; i < STORE.sessions.length; i++) {
          if (STORE.sessions[i].id === id) { STORE.sessions.splice(i, 1); break; }
        }

        if (STORE.current === id) {
          // Fall through to the most recent one left, or to an empty draft.
          var next = byRecency(STORE.sessions)[0];
          STORE.current = next ? next.id : null;
          if (next) replay(next); else clearLog();
        }

        persist();
        renderChats();
        syncModelSelect();
        setStatus('deleted');
        input.focus();
      }

      // ---- the model picker ----

      // Installed models, plus whatever the open chat is set to. A chat whose
      // model was deleted on the phone must still be able to name it — and keep
      // it — rather than silently reassigning the conversation.
      function modelNames() {
        // The missing one goes last rather than being sorted in among the real
        // ones, where "not installed" would be a surprise in the middle of the
        // list instead of the answer at the end of it.
        var names = models.slice().sort();
        var cur = currentModel();
        if (cur && names.indexOf(cur) === -1) names.push(cur);
        return names;
      }

      function syncModelSelect() {
        var names = modelNames();
        var cur = currentModel();

        // With nothing to offer, the control still has to say something, or it
        // renders as an empty box with no explanation of why it is empty.
        var values = names.length ? names : [''];

        var changed = values.length !== modelSel.options.length;
        if (!changed) {
          for (var i = 0; i < values.length; i++) {
            if (modelSel.options[i].value !== values[i]) { changed = true; break; }
          }
        }

        if (changed) {
          clearNode(modelSel);
          for (var k = 0; k < values.length; k++) {
            var opt = document.createElement('option');
            var name = values[k];
            opt.value = name;
            if (!name) opt.textContent = 'no model installed';
            else opt.textContent = modelsKnown && models.indexOf(name) === -1
              ? name + ' (not installed)'
              : name;
            modelSel.appendChild(opt);
          }
        }

        if (cur) modelSel.value = cur;
        modelSel.disabled = generating || !cur;
        renderHead();
      }

      function noListHint() {
        return 'Could not list the models installed on the phone. Chat still ' +
               'works; reload the list with ↻ once the server is reachable.';
      }

      function fetchModels() {
        reloadBtn.disabled = true;
        return fetch(BASE + '/api/tags')
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (data) {
            var found = [];
            if (data && Array.isArray(data.models)) {
              for (var i = 0; i < data.models.length; i++) {
                var m = data.models[i];
                if (m && typeof m.name === 'string' && m.name) found.push(m.name);
              }
              modelsKnown = true;
            } else {
              modelsKnown = false;
            }
            models = found;
            if (!modelsKnown) warn(noListHint());
          })
          .catch(function () {
            modelsKnown = false;
            models = [];
            warn(noListHint());
          })
          .then(function () {
            reloadBtn.disabled = false;
            syncModelSelect();
          });
      }

      // Switching mid-conversation changes who answers from the next turn on.
      // The turns already on screen stay as they were, and there is no attempt
      // to unload the old model from memory: a second browser might be in the
      // middle of generating with it.
      modelSel.addEventListener('change', function () {
        var picked = modelSel.value;
        if (!picked) return;

        var session = activeSession();
        if (session) {
          session.model = picked;
          session.updated = Date.now();
          persist();
          renderChats();
        } else {
          draftModel = picked;
          renderHead();
        }
        setStatus(picked);
        input.focus();
      });

      reloadBtn.addEventListener('click', function () { fetchModels(); });

      chatsToggle.addEventListener('click', function () {
        setChatsOpen(chatsEl.className.indexOf('open') === -1);
      });

      newChatBtn.addEventListener('click', newChat);

      // On a phone the rail covers the conversation, so escape closes it.
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && chatsEl.className.indexOf('open') !== -1) {
          setChatsOpen(false);
          chatsToggle.focus();
        }
      });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submit();
      });

      // Enter sends and Shift+Enter breaks the line, which is what every chat
      // box does; the exception is a phone keyboard, where Enter is the only
      // key there is.
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          submit();
        }
      });

      input.addEventListener('input', autosize);

      stopBtn.addEventListener('click', function () {
        if (controller) controller.abort();
      });

      function openStorage() {
        try {
          var s = window.localStorage;
          // Some browsers throw on the property access itself, and private modes
          // answer it with an object that refuses every write.
          return s && storageUsable(s) ? s : null;
        } catch (e) {
          return null;
        }
      }

      function readRaw(s) {
        try { return s.getItem(STORE_KEY); } catch (e) { return null; }
      }

      function init(cfg) {
        if (cfg && typeof cfg.ollama_port === 'number') PORT = cfg.ollama_port;
        BASE = baseUrl(location.hostname, PORT);

        DEFAULT_MODEL = (cfg && typeof cfg.model === 'string') ? cfg.model : '';
        draftModel = DEFAULT_MODEL;

        storage = openStorage();
        if (storage) {
          STORE = parseStore(readRaw(storage));
        } else {
          warn('This browser is not saving chats — private mode, or site data is ' +
               'blocked. The page still works; nothing you type here will be here ' +
               'after a reload.');
        }

        // Reopen where you left off, so a reload is not a reset.
        var newest = byRecency(STORE.sessions)[0];
        if (!activeSession() && newest) STORE.current = newest.id;
        var open = activeSession();
        if (open) replay(open);

        renderChats();
        syncModelSelect();
        renderEmpty();

        if (!currentModel()) {
          // The launcher writes runtime.json from the last-used model. Until one
          // has been chosen there is nothing to talk to, and saying so is better
          // than a request that fails with a server error. The saved chats are
          // still readable, which is why this no longer returns early.
          warn('No model chosen yet. In Termux run `momos chat <model>` once, ' +
               'then reload this page.');
          setStatus('no model');
        }

        fetchModels();
        autosize();
        input.focus();
      }

      // runtime.json is written beside this page by `momos ui`, so it is a
      // same-origin request and works with no server of its own.
      fetch('runtime.json', { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.json() : null; })
        .catch(function () { return null; })
        .then(init);
    })();
  </script>
</body>
</html>
