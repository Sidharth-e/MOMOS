<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<!-- momos-ui:5 -->
<title>MOMOS — web ui</title>
<!--
  The chat page for `momos ui`.

  Deliberately self-contained: no external stylesheet, font or script. It is
  served off a phone that may have no network of its own, so anything fetched
  from a CDN would be the one thing on the page that fails. That is also why
  the Markdown renderer below is hand-written rather than a library.

  The server it talks to is Ollama on this same device, reached at the address
  this browser actually dialled. That is the whole trick: open the page on the
  phone and it dials loopback, open it from a laptop and it dials the phone's
  address on the Wi-Fi, and neither needs configuring.

  Saved chats live in this browser's localStorage, not on the phone. The page is
  served by a static file server, so there is nowhere for it to write: the phone
  has no endpoint to post a chat to, and giving it one would mean another
  process competing with the model for the phone's memory. The cost is that the
  laptop's chats and the phone's chats are separate, and clearing site data
  clears them — which is what the rail's footer says.

  The look is "transcript": the conversation is a document emitted by a small
  machine, not a feed of bubbles. Structure is drawn with hairlines at low
  opacity and with the type itself — the model's prose is set in the system
  serif, because it is what you read; your own words stay in mono, because you
  typed them into a machine; the chrome is sans. One colour is allowed to mean
  something: ochre marks the model running, and appears nowhere else except the
  open thread and keyboard focus. Nothing here is fetched.

  Two blocks in here are lifted out and run under node by the test suite, and
  the markers around them are what the tests look for. Everything between
  `--- store:begin ---` and `--- store:end ---` must stay free of the DOM, and
  everything between `--- markdown:begin ---` and `--- markdown:end ---` must
  build through the element factory it is handed rather than a global. Move a
  marker and the test that reads it finds an empty block.

  The page is drawn as one full-height shell: a rail of chats on the left and a
  column of conversation on the right, each scrolling on its own. The rail has
  three states — expanded, a collapsed strip of initial-chips, and on a phone a
  drawer over the conversation — and the choice of the first two is remembered.

  The `momos-ui:` marker above is a version stamp. The launcher and installer
  look for it to decide whether the copy on the device is current, so it must
  stay, and its number must match UI_VERSION in scripts/momos.sh.
-->
<style>
  :root {
    color-scheme: dark;

    /* ground — warm graphite, paper grey under warm light, not blue-black */
    --ground:  #0e0d0b;
    --rail:    #131211;
    --raise:   #1a1817;
    --sunk:    #090808;

    /* structure — drawn with light rather than with boxes */
    --line:    rgba(233, 226, 210, 0.09);
    --line-2:  rgba(233, 226, 210, 0.18);

    /* ink */
    --ink:     #e9e4da;
    --dim:     #9c9589;
    --faint:   #6f6a61;

    /* the signal: the machine is working */
    --signal:      #cfa63a;
    --signal-soft: rgba(207, 166, 58, 0.16);
    --signal-line: rgba(207, 166, 58, 0.42);
    --alarm:       #c9603f;

    /* Three families, deliberately different: the serif is what you read, the
       mono is the machine talking and the words you typed into it, and the sans
       is the chrome. None is fetched; all three are whatever the device already
       has, which is the only honest choice offline. */
    --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
             "Helvetica Neue", Arial, sans-serif;
    --serif: ui-serif, Charter, "Bitstream Charter", "Iowan Old Style",
             "Palatino Linotype", Palatino, Georgia, serif;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono",
             "Liberation Mono", monospace;

    --t-xs: 0.6875rem;   /* rail metadata, instrumentation */
    --t-sm: 0.8125rem;   /* chrome: buttons, stamps, notices */
    --t-md: 0.9375rem;   /* the bar title */

    --rail-w: 16.5rem;
    --rail-c: 3.5rem;
    --ease:   cubic-bezier(.2, .7, .3, 1);

    /* The page's one gutter. Named rather than repeated, because the composer
       has to add exactly this back on to the measure to line its card up with
       the text column — and a second copy of the expression would drift from
       this one the moment either is touched. */
    --pad: clamp(1rem, 3vw, 1.75rem);

    /* A shade under the 68ch a proportional face wants, because this column
       also has to hold code and tables. Note that a `ch` in a custom property
       declared here resolves against the root font-size, not the element that
       ends up using it, so this is a fixed width rather than a per-element one
       — which is what makes it usable as the shared measure for the column and
       the card together. */
    --measure: 64ch;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { height: 100%; }

  body {
    height: 100%;
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: var(--t-md);
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    /* The panes scroll, not the page. A chat that scrolls the whole window
       takes the composer off the bottom of the screen with it. */
    overflow: hidden;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* Digits that line up in columns: the readout, the stamps, the rail's stamps. */
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ---------------------------------------------------------------------
     Shell
     --------------------------------------------------------------------- */

  .shell {
    height: 100%;
    display: grid;
    grid-template-columns: var(--rail-w) minmax(0, 1fr);
    transition: grid-template-columns 260ms var(--ease);
  }

  .shell[data-rail="collapsed"] { grid-template-columns: var(--rail-c) minmax(0, 1fr); }

  /* ---------------------------------------------------------------------
     The rail — a list, a strip of chips, or a drawer on a phone
     --------------------------------------------------------------------- */

  .rail {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--rail);
    border-right: 1px solid var(--line);
    overflow: hidden;
  }

  .rail-top { display: flex; align-items: center; gap: 0.5rem; padding: 0.7rem 0.6rem 0.7rem 0.95rem; }

  .rail-mark { display: flex; align-items: baseline; gap: 0.5rem; flex: 1; min-width: 0; padding: 0; text-align: left; }

  /* A wordmark that would do nothing when clicked is not a control: see
     syncRailMark. It keeps its look either way, because it is still the name. */
  .rail-mark:disabled { cursor: default; }

  .rail-word {
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.2em;
    /* The tracking pushes the last letter off-centre; pull it back. */
    margin-right: -0.2em; color: var(--ink); white-space: nowrap;
  }

  /* The two-letter mark that replaces the wordmark when the rail is a strip. */
  .rail-mono { display: none; font-family: var(--mono); font-size: var(--t-sm); font-weight: 600; letter-spacing: 0.08em; color: var(--ink); }

  .rail-count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--t-xs); color: var(--faint); }

  .rail-collapse {
    flex: none; width: 1.75rem; height: 1.75rem;
    display: grid; place-items: center; border-radius: 4px; color: var(--faint);
    transition: color 140ms, background 140ms;
  }

  .rail-collapse:hover { color: var(--ink); background: rgba(233, 226, 210, 0.06); }
  .rail-collapse svg { transition: transform 260ms var(--ease); }

  .rail-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .rail-new {
    display: flex; align-items: center; gap: 0.6rem;
    margin: 0 0.6rem 0.6rem; padding: 0.5rem 0.6rem;
    border: 1px solid var(--line); border-radius: 6px;
    color: var(--ink); font-size: var(--t-sm); text-align: left;
    transition: border-color 140ms, background 140ms;
  }

  .rail-new:hover:not(:disabled) { border-color: var(--line-2); background: rgba(233, 226, 210, 0.04); }
  .rail-new:disabled { color: var(--faint); cursor: default; }
  .rail-new .plus { color: var(--faint); font-family: var(--mono); }
  .rail-new kbd { margin-left: auto; font-family: var(--mono); font-size: var(--t-xs); color: var(--faint); }

  .rail-search { position: relative; margin: 0 0.6rem 0.5rem; }

  .rail-search .glass { position: absolute; left: 0.55rem; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; display: grid; }

  .rail-search input {
    width: 100%; font: inherit; font-size: var(--t-sm); color: var(--ink);
    background: var(--ground); border: 1px solid var(--line); border-radius: 6px;
    padding: 0.4rem 0.55rem 0.4rem 1.9rem;
  }

  .rail-search input::placeholder { color: var(--faint); }
  .rail-search input:focus { outline: none; border-color: var(--signal); }

  .rail-label { padding: 0.4rem 0.95rem 0.25rem; font-size: var(--t-xs); color: var(--faint); }

  .chat-list {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    list-style: none; margin: 0; padding: 0 0.6rem 0.6rem;
    display: flex; flex-direction: column; gap: 1px;
  }

  .thread { display: flex; align-items: center; border-radius: 6px; position: relative; }
  .thread:hover { background: rgba(233, 226, 210, 0.04); }
  .thread[data-current="true"] { background: rgba(233, 226, 210, 0.05); }

  /* Which chat is open, drawn as a rule against the rail's edge. Carried also by
     aria-current on the button, which is the part a screen reader can hear. */
  .thread[data-current="true"]::before {
    content: ""; position: absolute; left: 0; top: 0.5rem; bottom: 0.5rem;
    width: 2px; border-radius: 2px; background: var(--signal);
  }

  .chat-open {
    flex: 1; min-width: 0; display: block;
    font: inherit; font-size: var(--t-sm); text-align: left; color: var(--dim);
    padding: 0.4rem 0.5rem 0.45rem 0.55rem; line-height: 1.35;
    /* A title is one line by construction, so it can be cut with an ellipsis
       rather than wrapping and making the rows uneven heights. */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* The second line of a row — when you last said something in it — and the chip
     the strip shows instead of a title. Both are drawn by the stylesheet from
     attributes, so the button holds the title and nothing else: the title is
     what the page tests read back, and what a screen reader announces. */
  .chat-open[data-when]::after {
    content: attr(data-when);
    display: block;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: var(--t-xs); letter-spacing: 0.04em; color: var(--faint);
  }

  .chat-open:hover:not(:disabled) { color: var(--ink); }
  .thread[data-current="true"] .chat-open { color: var(--ink); }
  .chat-open:disabled { cursor: default; }

  .thread-del {
    flex: none; width: 1.6rem; height: 1.6rem; margin-right: 0.35rem;
    display: grid; place-items: center; border-radius: 4px;
    font-size: var(--t-sm); color: var(--faint);
    /* Hidden until the row is pointed at, so the list reads as titles. A phone
       has no hover, so there it is always visible — an affordance you cannot
       reach is worse than a busy row. */
    opacity: 0; transition: opacity 140ms, color 140ms, background 140ms;
  }

  .thread:hover .thread-del, .thread-del:focus-visible { opacity: 1; }
  .thread-del:hover:not(:disabled) { color: var(--alarm); background: rgba(201, 96, 63, 0.1); }

  @media (hover: none) {
    .thread-del { opacity: 1; }
  }

  /* Outside the scrolling list on purpose. Inside it, an empty rail would float
     the line to the bottom of a tall void, a long way from the heading it
     belongs to. */
  .threads-empty { margin: 0; padding: 0.2rem 0.95rem 0.7rem; font-size: var(--t-xs); color: var(--faint); }
  .threads-empty[hidden] { display: none; }

  .rail-foot {
    border-top: 1px solid var(--line);
    padding: 0.6rem 0.95rem 0.7rem;
    font-size: var(--t-xs); line-height: 1.5; color: var(--faint);
  }

  .rail-foot b { color: var(--dim); font-weight: 500; }

  /* ---- collapsed: the rail becomes a strip of chips ---- */

  .shell[data-rail="collapsed"] .rail-word,
  .shell[data-rail="collapsed"] .rail-count,
  .shell[data-rail="collapsed"] .rail-search,
  .shell[data-rail="collapsed"] .rail-label,
  .shell[data-rail="collapsed"] .rail-foot,
  .shell[data-rail="collapsed"] .threads-empty,
  .shell[data-rail="collapsed"] .rail-new-label,
  .shell[data-rail="collapsed"] .rail-new kbd,
  .shell[data-rail="collapsed"] .thread-del { display: none; }

  .shell[data-rail="collapsed"] .rail-mono { display: block; }
  .shell[data-rail="collapsed"] .rail-top { flex-direction: column; align-items: center; padding: 0.7rem 0; gap: 0.7rem; }
  .shell[data-rail="collapsed"] .rail-mark { flex: none; }
  .shell[data-rail="collapsed"] .rail-collapse svg { transform: rotate(180deg); }
  .shell[data-rail="collapsed"] .rail-new { justify-content: center; margin-inline: 0.5rem; padding-inline: 0; }
  .shell[data-rail="collapsed"] .chat-list { padding-inline: 0.5rem; }
  .shell[data-rail="collapsed"] .thread { justify-content: center; }
  .shell[data-rail="collapsed"] .thread[data-current="true"]::before { top: 0.35rem; bottom: 0.35rem; }

  /* A strip has no room for a title, so the row is its chip alone. The title is
     still inside the button — the page tests read it back — so it is taken out
     of the picture with a font-size of zero rather than removed from the DOM. */
  .shell[data-rail="collapsed"] .chat-open { font-size: 0; text-align: center; padding-inline: 0; }
  .shell[data-rail="collapsed"] .chat-open[data-when]::after { display: none; }

  .shell[data-rail="collapsed"] .chat-open::before {
    content: attr(data-initials);
    display: block; width: 1.6rem; height: 1.6rem; margin: 0 auto;
    line-height: 1.6rem; text-align: center;
    border: 1px solid var(--line); border-radius: 5px; background: var(--raise);
    font-family: var(--mono); font-size: 0.625rem; letter-spacing: 0.02em; color: var(--dim);
  }

  .shell[data-rail="collapsed"] .thread[data-current="true"] .chat-open::before { color: var(--signal); border-color: var(--signal-soft); }

  /* ---------------------------------------------------------------------
     The conversation
     --------------------------------------------------------------------- */

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--ground); }

  .bar {
    display: flex; align-items: center; gap: 0.5rem; min-height: 3.25rem;
    padding: 0.5rem var(--pad);
    border-bottom: 1px solid var(--line);
  }

  .drawer-btn { display: none; color: var(--dim); padding: 0.35rem; border-radius: 4px; }
  .drawer-btn:hover { color: var(--ink); background: rgba(233, 226, 210, 0.06); }

  .bar-title {
    flex: 1; min-width: 0; margin: 0;
    font-size: var(--t-md); font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .notice {
    margin: 0;
    padding: 0.6rem var(--pad);
    border-bottom: 1px solid var(--line);
    background: rgba(201, 96, 63, 0.06);
    font-family: var(--mono); font-size: var(--t-xs); line-height: 1.55;
    color: var(--dim);
    /* Each warning is its own line; they are stacked rather than replaced so a
       second reason the page is degraded cannot hide the first. */
    white-space: pre-line;
  }

  .notice strong { color: var(--alarm); font-weight: 600; }
  .notice[hidden] { display: none; }

  .transcript-wrap { position: relative; flex: 1; min-height: 0; display: flex; }

  .transcript {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: clamp(1.5rem, 4vh, 2.75rem) var(--pad) 2rem;
  }

  .turns { max-width: var(--measure); margin: 0 auto; display: flex; flex-direction: column; gap: clamp(1.5rem, 3.5vh, 2.25rem); }

  .turn { min-width: 0; }

  /* Your words: mono, dimmer, held off the margin by a hairline — the one you
     typed into a machine rather than the one you read. The `> ` a shell prompt
     would put there is gone; the rule does that job. */
  .turn.user .md.plain {
    border-left: 2px solid var(--line-2); padding-left: 0.95rem;
    font-family: var(--mono); font-size: 0.875rem; line-height: 1.6;
    color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* The reply: serif, full measure, no container. */
  .turn.assistant .body .md {
    font-family: var(--serif); font-size: 1.0625rem; line-height: 1.65; color: var(--ink);
  }

  .turn.assistant .body.failed .md {
    font-family: var(--mono); font-size: var(--t-sm); line-height: 1.6;
    color: var(--alarm); white-space: pre-wrap;
  }

  /* Which model wrote this, and how fast it ran on this phone. Only this product
     would carry that line, and it is the number you actually care about. The
     rate is only known for a reply that ran in front of you — a chat read back
     from storage has no timing in it — so a replayed reply is stamped with the
     model alone. */
  .stamp { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.9rem; font-family: var(--mono); font-size: var(--t-xs); color: var(--faint); }
  .stamp .sep { color: var(--line-2); }
  .turn.assistant.failed .stamp { color: var(--alarm); }

  /* DeepSeek R1 and friends stream their working-out in a separate field. It is
     folded away and dimmed because it is reasoning, not the reply — but it has
     to be shown, or those models look like a long silence followed by an answer
     that came from nowhere. It is not saved with a chat: the folds are read
     once, and keeping them would multiply the storage several times over for
     something already scrolled past. */
  .think { margin: 0 0 1.1rem; padding-left: 0.95rem; border-left: 2px solid var(--line); }
  .think summary { cursor: pointer; list-style: none; font-family: var(--mono); font-size: var(--t-xs); color: var(--faint); }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::before { content: "▸ "; }
  .think[open] summary::before { content: "▾ "; }
  .think summary:hover { color: var(--dim); }
  .think pre { margin: 0.55rem 0 0; font-family: var(--mono); font-size: var(--t-xs); line-height: 1.65; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* The cursor that trails a streaming reply. Deliberately NOT called "caret":
     that name would belong to a chevron if one came back, and sharing a name
     between a text cursor and a mark on a control is how one of them ends up
     wearing the other's block. */
  .cursor { display: inline-block; width: 0.5em; height: 1em; margin-left: 0.08em; vertical-align: -0.12em; background: var(--signal); animation: blink 1.1s step-end infinite; }

  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }

  /* ---------------------------------------------------------------------
     What the model wrote back.
     --------------------------------------------------------------------- */

  .md { overflow-wrap: anywhere; }
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 0.9em; }

  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 1.4em 0 0.5em; font-weight: 600; line-height: 1.3; letter-spacing: -0.008em;
  }

  .md h1 { font-size: 1.3em; }
  .md h2 { font-size: 1.15em; }
  .md h3 { font-size: 1em; }
  .md h4, .md h5, .md h6 { font-size: 0.94em; }

  /* Headings the model wrote are structure inside one reply, so they step down
     from the reply itself rather than competing with the page title above. */

  .md ul, .md ol { margin: 0 0 0.9em; padding-left: 1.35em; }
  .md li { margin: 0.2em 0; }
  .md li > ul, .md li > ol { margin: 0.2em 0; }
  .md li::marker { color: var(--faint); }

  .md-task {
    list-style: none;
    /* Pulled back out of the list's padding so the box lines up with the markers
       of the items around it. */
    margin-left: -1.35em; display: flex; gap: 0.5rem; align-items: baseline;
  }

  .md-task input { flex: none; margin: 0; accent-color: var(--signal); }

  .md blockquote { margin: 0 0 0.9em; padding-left: 1rem; border-left: 2px solid var(--line); color: var(--dim); }

  .md hr { margin: 1.4em 0; border: 0; border-top: 1px solid var(--line); }

  .md-code {
    margin: 0 0 1em; padding: 0.8rem 0.9rem;
    background: var(--sunk); border: 1px solid var(--line); border-radius: 7px;
    overflow-x: auto;
    font-family: var(--mono); font-size: var(--t-sm); line-height: 1.6; color: var(--ink);
    tab-size: 2;
  }

  .md-code code { font: inherit; white-space: pre; }

  /* The language, likewise drawn from an attribute rather than written into the
     block — so the code is still only the code, and copying it does not paste
     the label in among the first line. */
  .md-code[data-lang]::before {
    content: attr(data-lang);
    display: block; margin-bottom: 0.5rem;
    font-size: var(--t-xs); letter-spacing: 0.1em; color: var(--faint);
    -webkit-user-select: none; user-select: none;
  }

  .md-ic {
    padding: 0.1em 0.34em;
    font-family: var(--mono); font-size: 0.85em;
    background: var(--raise); border: 1px solid var(--line); border-radius: 3px;
    color: var(--ink);
  }

  .md a { color: var(--signal); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
  .md strong { font-weight: 600; }
  .md del { color: var(--dim); }

  .md table { margin: 0 0 1em; border-collapse: collapse; font-size: 0.88em; }
  .md th, .md td { padding: 0.3rem 0.6rem; border: 1px solid var(--line); text-align: left; }
  .md th { background: var(--raise); font-weight: 600; }

  /* ---------------------------------------------------------------------
     What is on screen before anyone has said anything. It is a sibling of the
     conversation, not inside it: the log has to stay empty for the page tests to
     read a cleared conversation as cleared.
     --------------------------------------------------------------------- */

  .empty { max-width: var(--measure); margin: 0 auto; padding-top: 7vh; }
  .empty[hidden] { display: none; }
  .empty h2 { margin: 0 0 0.5rem; font-family: var(--serif); font-weight: 500; font-size: 1.5rem; letter-spacing: -0.01em; color: var(--ink); }
  .empty p { margin: 0 0 1.6rem; color: var(--dim); max-width: 46ch; }

  .starters { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .starters button { padding: 0.7rem 0.2rem; border-bottom: 1px solid var(--line); text-align: left; color: var(--dim); transition: color 140ms, padding-left 140ms; }
  .starters button:hover { color: var(--ink); padding-left: 0.6rem; }

  /* ---------------------------------------------------------------------
     Jump to latest — shown only when a reply is arriving off the bottom of the
     view, so following one is a choice rather than something done to you.
     --------------------------------------------------------------------- */

  .jump {
    position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%);
    display: flex; align-items: center; gap: 0.45rem;
    padding: 0.4rem 0.8rem; background: var(--raise);
    border: 1px solid var(--line-2); border-radius: 999px;
    font-size: var(--t-xs); color: var(--ink);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    transition: transform 180ms var(--ease);
  }

  .jump[hidden] { display: none; }
  .jump .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--signal); }
  .jump:hover { transform: translateX(-50%) translateY(-1px); }

  /* ---------------------------------------------------------------------
     The composer — one surface, ruled like the rest of the page

     The input is a single bordered card rather than a bare field on a bar: it is
     the one thing you touch constantly, so it should look like an object. The
     model chooser sits inside it, at the bottom left, because that is where you
     are standing when you decide who answers; the readout and the send/stop
     control sit opposite it, which is where your eye already is.
     --------------------------------------------------------------------- */

  .composer { border-top: 1px solid var(--line); background: var(--ground); }

  /* The measure plus twice the gutter, so that once this element's own padding
     is taken off, what is left is exactly the width of the text column above —
     the card's edges land on the same two vertical lines as the prose. Adding a
     fixed 3.5rem instead only works while the gutter is at its widest, and the
     card drifts a few pixels wider than the prose on a narrow window. */
  .composer-inner {
    max-width: calc(var(--measure) + var(--pad) * 2);
    margin: 0 auto;
    padding: 0.9rem var(--pad) 1rem;
  }

  .input-card {
    display: flex; flex-direction: column;
    background: var(--raise);
    border: 1px solid var(--line-2);
    border-radius: 10px;
    transition: border-color 160ms var(--ease);
  }

  /* The card lights up rather than the textarea drawing its own outline, which
     would sit awkwardly inside the border. */
  .input-card:focus-within { border-color: var(--signal-line); }

  .input-card textarea {
    display: block; width: 100%;
    border: 0; background: none; resize: none; outline: none;
    color: var(--ink); font: inherit; font-size: 0.9rem; line-height: 1.6;
    padding: 0.8rem 0.9rem 0.15rem;
    min-height: 2.1rem; max-height: 30vh;
  }

  .input-card textarea::placeholder { color: var(--faint); }
  /* Read-only while a reply is arriving: readable and selectable, unlike a
     disabled field, which greys out and says "broken". */
  .input-card textarea:read-only { color: var(--dim); }

  .input-row { display: flex; align-items: center; gap: 0.5rem; padding: 0 0.5rem 0.5rem; }

  /* ---- the model chooser, living at the input ---- */

  .model { position: relative; display: flex; align-items: center; flex: 0 1 auto; min-width: 0; }

  .pick { position: relative; display: flex; align-items: center; min-width: 0; color: var(--dim); }

  /* The mark beside the model. It pulses only while that model is generating. */
  .pick::before {
    content: ""; flex: none; width: 5px; height: 5px; margin-right: 0.35rem;
    border-radius: 50%; background: var(--signal);
  }

  .input-card[data-busy="true"] .pick::before { animation: pulse 1.4s ease-in-out infinite; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* The chevron is a rotated corner rather than an icon: a native select cannot
     hold children, and the alternative — a custom listbox — would cost a phone
     the picker it already knows how to open. */
  .pick::after {
    content: ""; position: absolute; right: 0.45rem; top: 50%;
    width: 0.3rem; height: 0.3rem;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }

  .pick select {
    appearance: none; -webkit-appearance: none;
    flex: 0 1 auto; min-width: 0; max-width: min(15rem, 42vw);
    font: inherit; font-family: var(--mono); font-size: var(--t-xs);
    color: inherit; background: none; border: 0; border-radius: 6px;
    padding: 0.32rem 1.1rem 0.32rem 0.5rem;
    cursor: pointer; text-overflow: ellipsis;
    transition: color 140ms, background 140ms;
  }

  .pick select:hover, .pick select:focus { color: var(--ink); background: rgba(233, 226, 210, 0.07); outline: none; }
  .pick select:disabled { color: var(--faint); cursor: default; }

  .icon {
    flex: none; display: grid; place-items: center;
    width: 1.6rem; height: 1.6rem; border-radius: 5px;
    font-family: var(--mono); font-size: var(--t-sm);
    color: var(--faint);
    transition: color 140ms, background 140ms;
  }

  .icon:hover:not(:disabled) { color: var(--ink); background: rgba(233, 226, 210, 0.07); }
  .icon:disabled { color: var(--line-2); cursor: default; }

  .composer-side { margin-left: auto; display: flex; align-items: center; gap: 0.7rem; }

  /* Instrumentation, inline in the composer rather than a line of text under it:
     while a reply arrives this is what the phone is doing — how fast, how long. */
  .readout { display: flex; align-items: baseline; gap: 0.7rem; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: var(--t-xs); color: var(--faint); }
  .readout[hidden] { display: none; }
  .readout .rate { color: var(--signal); }
  .readout .unit { margin-left: 0.15em; }

  .send {
    display: flex; align-items: center; gap: 0.45rem;
    padding: 0.4rem 0.75rem; min-height: 2rem; border-radius: 7px;
    background: rgba(233, 226, 210, 0.09); font-size: var(--t-sm); color: var(--ink);
    transition: background 140ms, color 140ms;
  }

  .send:hover:not(:disabled) { background: rgba(233, 226, 210, 0.16); }
  .send:disabled { color: var(--faint); background: rgba(233, 226, 210, 0.04); cursor: default; }
  .send[hidden] { display: none; }
  .send.stop { color: var(--signal); background: var(--signal-soft); }
  .send.stop:hover { background: rgba(207, 166, 58, 0.26); }
  .stop-mark { width: 7px; height: 7px; border-radius: 1px; background: currentColor; flex: none; }

  /* ---------------------------------------------------------------------
     A phone: the rail is a drawer over the conversation. A drawer, not a panel
     above it: the list is the thing you switch with, and giving it the top
     third of a phone screen costs more than it returns.
     --------------------------------------------------------------------- */

  .scrim { display: none; }

  @media (max-width: 60rem) {
    .shell, .shell[data-rail="collapsed"] { grid-template-columns: minmax(0, 1fr); }

    .rail {
      position: fixed; inset: 0 auto 0 0; z-index: 30;
      width: min(18.5rem, 86vw);
      transform: translateX(-100%);
      transition: transform 240ms var(--ease);
      border-right-color: var(--line-2);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
    }

    .rail[data-open="true"] { transform: none; }

    /* In the drawer there is nothing to collapse to, so the toggle is a close. */
    .rail-collapse svg { transform: rotate(180deg); }

    .scrim {
      display: block; position: fixed; inset: 0; z-index: 29;
      background: rgba(6, 6, 5, 0.6); opacity: 0; pointer-events: none;
      transition: opacity 240ms var(--ease);
    }

    .scrim[data-open="true"] { opacity: 1; pointer-events: auto; }

    .drawer-btn { display: block; }
    .bar { min-height: 3rem; }
    .composer-inner { padding-bottom: calc(0.9rem + env(safe-area-inset-bottom, 0px)); }
    .input-card textarea { font-size: 1rem; }   /* 16px keeps iOS from zooming on focus */
    .pick select { padding-block: 0.45rem; max-width: min(15rem, 55vw); }
    .send { min-height: 2.5rem; padding-inline: 0.9rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .shell, .rail, .scrim, .rail-collapse svg, .jump, .input-card { transition: none; }
    .cursor, .input-card[data-busy="true"] .pick::before { animation: none; }
  }
</style>
</head>
<body>
  <div class="shell" id="shell" data-rail="expanded">
    <!-- The rail. On a phone it is the drawer; on anything wider it is the left
         column and is always there. Either way it is first in the document, so
         tabbing reaches the list before the conversation. -->
    <nav class="rail" id="chats" aria-label="Saved chats">
      <div class="rail-top">
        <button type="button" class="rail-mark" id="rail-mark" title="MOMOS">
          <span class="rail-word">MOMOS</span>
          <span class="rail-mono">MO</span>
          <span class="rail-count" id="chats-label"></span>
        </button>
        <button type="button" class="rail-collapse" id="rail-collapse"
                aria-expanded="true" aria-controls="rail-body"
                aria-label="Collapse chat list">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3.5 5.5 8l4.5 4.5" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="rail-body" id="rail-body">
        <button type="button" class="rail-new" id="new-chat">
          <span class="plus" aria-hidden="true">+</span>
          <span class="rail-new-label">New chat</span>
          <kbd>N</kbd>
        </button>

        <div class="rail-search">
          <span class="glass" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="4.25" stroke="currentColor" stroke-width="1.4"/>
              <path d="m10.2 10.2 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <label class="sr-only" for="chat-search">Search chats</label>
          <input id="chat-search" type="search" placeholder="Search chats" autocomplete="off">
        </div>

        <p class="rail-label">Recent</p>
        <p class="threads-empty" id="chats-empty">no saved chats</p>
        <ul class="chat-list" id="chat-list"></ul>
      </div>

      <div class="rail-foot"><b>Saved in this browser.</b> Clearing site data clears them.</div>
    </nav>

    <!-- The drawer's backdrop. A sibling of the rail so the sheet can reach it
         from the rail's own open state, with no script involved. -->
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="bar">
        <button type="button" class="drawer-btn" id="chats-toggle"
                aria-expanded="false" aria-controls="rail-body"
                aria-label="Open chat list">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 6h14M3 10h14M3 14h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <h1 class="bar-title" id="chat-title">New chat</h1>
      </header>

      <p class="notice" id="banner" hidden></p>

      <div class="transcript-wrap">
        <div class="transcript" id="transcript">
          <!-- aria-live is off on the conversation on purpose. A polite live
               region over a token-by-token stream reads every fragment aloud,
               which is unusable. Arrivals and state changes are announced
               through #status instead. Written as one line so nothing can
               accidentally become content. -->
          <div class="turns" id="log" role="log" aria-live="off" aria-label="Conversation"></div>

          <div class="empty" id="empty" hidden>
            <h2>Ask the phone something.</h2>
            <p>One model stays in memory between turns. Longer questions get slower answers, not worse ones.</p>
            <div class="starters">
              <button type="button" data-ask="Which model fits in 4 GB of RAM?">Which model fits in 4 GB of RAM?</button>
              <button type="button" data-ask="Why does my phone kill ollama when I switch apps?">Why does my phone kill ollama when I switch apps?</button>
              <button type="button" data-ask="Explain the KV cache in one paragraph.">Explain the KV cache in one paragraph</button>
            </div>
          </div>
        </div>

        <button type="button" class="jump" id="jump" hidden>
          <span class="dot" aria-hidden="true"></span> Jump to latest
        </button>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-inner">
          <div class="input-card" id="input-card" data-busy="false">
            <label class="sr-only" for="prompt">Message</label>
            <textarea id="prompt" rows="1" spellcheck="false" placeholder="Ask something"></textarea>

            <div class="input-row">
              <div class="model">
                <span class="pick">
                  <label class="sr-only" for="model">Model</label>
                  <select id="model"></select>
                </span>
                <button type="button" class="icon" id="reload-models"
                        title="Reload the model list"
                        aria-label="Reload the model list">↻</button>
              </div>

              <div class="composer-side">
                <span class="readout" id="readout" hidden>
                  <span><span class="rate num" id="ro-rate">0</span><span class="unit">tok/s</span></span>
                  <span class="num" id="ro-time">0.0s</span>
                </span>
                <button class="send" id="send" type="submit">Send</button>
                <button class="send stop" id="stop" type="button" hidden>
                  <span class="stop-mark" aria-hidden="true"></span>Stop
                </button>
              </div>
            </div>
          </div>
        </div>
      </form>

      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </main>
  </div>

  <script>
    (function () {
      'use strict';

      var turnsEl = document.getElementById('log');
      var transcriptEl = document.getElementById('transcript');
      var emptyEl = document.getElementById('empty');
      var chatTitle = document.getElementById('chat-title');
      var form = document.getElementById('composer');
      var input = document.getElementById('prompt');
      var sendBtn = document.getElementById('send');
      var stopBtn = document.getElementById('stop');
      var statusEl = document.getElementById('status');
      var banner = document.getElementById('banner');
      var modelSel = document.getElementById('model');
      var reloadBtn = document.getElementById('reload-models');
      var chatsEl = document.getElementById('chats');
      var chatList = document.getElementById('chat-list');
      var chatEmpty = document.getElementById('chats-empty');
      var chatsLabel = document.getElementById('chats-label');
      var chatsToggle = document.getElementById('chats-toggle');
      var newChatBtn = document.getElementById('new-chat');
      var shellEl = document.getElementById('shell');
      var railCollapse = document.getElementById('rail-collapse');
      var railMark = document.getElementById('rail-mark');
      var searchEl = document.getElementById('chat-search');
      var scrimEl = document.getElementById('scrim');
      var inputCard = document.getElementById('input-card');
      var jumpBtn = document.getElementById('jump');
      var readoutEl = document.getElementById('readout');
      var roRate = document.getElementById('ro-rate');
      var roTime = document.getElementById('ro-time');

      var PORT = 11434;   // replaced by whatever runtime.json says
      var BASE = null;
      var DEFAULT_MODEL = '';  // what runtime.json last recorded
      var draftModel = '';     // the model a chat not yet started would use
      var models = [];         // installed names from /api/tags; [] if unknown
      // Whether /api/tags actually answered. An empty list means "nothing
      // installed" only if it did — otherwise every model would be labelled
      // missing, which is a claim the page has no grounds for.
      var modelsKnown = false;
      var storage = null;      // localStorage, or null when it cannot be used
      var generating = false;
      var controller = null;
      var current = null;      // the reply being streamed

      // The one preference the page keeps outside the chats: whether the rail is
      // a list or a strip. Read and written behind a try/catch of its own,
      // because it is a convenience and a browser that refuses storage must
      // still get a working page.
      var RAIL_KEY = 'momos.rail';

// --- store:begin ---
      // Everything between these markers is free of the DOM, window and fetch:
      // tests/test-ui-store.sh extracts this block and runs it under node
      // against a stub storage. Keep it that way, or that test stops meaning
      // anything.

      var STORE_KEY = 'momos.sessions.v1';
      var MAX_SESSIONS = 50;
      var TITLE_MAX = 40;

      var WHEN_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                         'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      function newId() {
        return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
      }

      // A conversation's name is the first thing you said in it. Only the first
      // line survives, because a pasted stack trace would otherwise become a
      // paragraph in a 15rem column.
      function titleFor(text) {
        var line = String(text == null ? '' : text).split('\n')[0].trim();
        if (!line) return 'untitled';
        if (line.length <= TITLE_MAX) return line;
        return line.slice(0, TITLE_MAX - 1).trim() + '…';
      }

      // The second line of a row in the rail. `updated` is the store's own
      // field, which is why the formatter lives here beside it — and why it
      // takes "now" as an argument rather than reading a clock, so a test can
      // ask it a question with a fixed answer. Relative rather than absolute
      // up to a week, because "when did I last talk in this" is a question
      // about distance, and a date would make you do the subtraction yourself.
      function whenLabel(updated, now) {
        if (typeof updated !== 'number' || !isFinite(updated) || updated <= 0) return '';
        var gap = now - updated;
        // A clock that moved backwards is the device's business, not a reason
        // to render "-3h".
        if (!isFinite(gap) || gap < 60000) return 'now';
        if (gap < 3600000) return Math.floor(gap / 60000) + 'm';
        if (gap < 86400000) return Math.floor(gap / 3600000) + 'h';
        if (gap < 604800000) return Math.floor(gap / 86400000) + 'd';
        var d = new Date(updated);
        return d.getDate() + ' ' + WHEN_MONTHS[d.getMonth()];
      }

      function isMessage(m) {
        return !!m && typeof m === 'object' &&
          (m.role === 'user' || m.role === 'assistant') &&
          typeof m.content === 'string';
      }

      // Recency is carried twice: `updated` is the wall-clock stamp the rail
      // shows, and the position in STORE.sessions is the order everything else
      // reads through byRecency. Date.now() only resolves to the millisecond,
      // so two chats touched inside one of them compare equal -- starting a
      // chat and switching the model on another are milliseconds apart -- and
      // the sort would then keep whichever of the two happened to sit first in
      // the array. Moving the chat to the head on every touch makes the array
      // order the recency order, so that fallback gives the right answer
      // instead of an arbitrary one.
      function touch(session) {
        session.updated = Date.now();
        var at = STORE.sessions.indexOf(session);
        if (at !== -1) STORE.sessions.splice(at, 1);
        STORE.sessions.unshift(session);
      }

      // Newest first, so "the most recent chat" is the head of the list and the
      // storage cap is a slice.
      function byRecency(sessions) {
        return sessions.slice().sort(function (a, b) {
          return (b.updated || 0) - (a.updated || 0);
        });
      }

      // Stored JSON is untrusted: it is whatever some earlier version of this
      // page, or a hand-edit, left behind. Anything malformed is dropped rather
      // than thrown, because a page that will not start cannot be repaired from
      // inside the browser.
      function parseStore(raw) {
        var empty = { current: null, sessions: [] };
        if (typeof raw !== 'string' || !raw) return empty;

        var data;
        try { data = JSON.parse(raw); } catch (e) { return empty; }
        if (!data || typeof data !== 'object' || !Array.isArray(data.sessions)) return empty;

        var kept = [];
        for (var i = 0; i < data.sessions.length; i++) {
          var s = data.sessions[i];
          if (!s || typeof s !== 'object') continue;
          if (typeof s.id !== 'string' || !s.id) continue;

          var list = Array.isArray(s.messages) ? s.messages : [];
          var messages = [];
          for (var j = 0; j < list.length; j++) {
            // Rebuilt field by field rather than copied: whatever else was in
            // there is not ours to carry forward, and the request body is built
            // from these objects.
            if (isMessage(list[j])) {
              messages.push({ role: list[j].role, content: list[j].content });
            }
          }
          // A chat is created on its first message, so an empty one was never
          // meant to be stored and is not worth a row.
          if (!messages.length) continue;

          kept.push({
            id: s.id,
            title: (typeof s.title === 'string' && s.title) || titleFor(messages[0].content),
            model: typeof s.model === 'string' ? s.model : '',
            updated: typeof s.updated === 'number' && isFinite(s.updated) ? s.updated : 0,
            messages: messages
          });
        }

        kept = byRecency(kept).slice(0, MAX_SESSIONS);

        var currentId = null;
        for (var k = 0; k < kept.length; k++) {
          if (kept[k].id === data.current) { currentId = kept[k].id; break; }
        }

        return { current: currentId, sessions: kept };
      }

      // The exact shape that goes into storage. The list is passed in rather
      // than read off the store so the quota path below can write a shorter
      // list of the same shape.
      function serializeStore(store, sessions) {
        var currentId = null;
        for (var i = 0; i < sessions.length; i++) {
          if (sessions[i].id === store.current) { currentId = sessions[i].id; break; }
        }
        return JSON.stringify({ current: currentId, sessions: sessions });
      }

      // localStorage is small and a phone gets there long before a laptop does.
      // A write that fails is no reason to lose the page, so the oldest chat is
      // given up and the write retried — the cheapest thing to lose first.
      //
      // Returns the ids that could not be kept, so the page can say so, or an
      // empty array when everything fitted. The caller keeps its full store in
      // memory either way; only the saved copy is smaller.
      function safeSet(storage, store) {
        var ordered = byRecency(store.sessions || []);
        var keep = ordered.slice(0, MAX_SESSIONS);
        var dropped = [];
        for (var d = MAX_SESSIONS; d < ordered.length; d++) dropped.push(ordered[d].id);

        // Walks down to an empty write, because the failure might not be size
        // at all — a browser can refuse storage outright — and a loop that can
        // only end by succeeding would spin.
        for (var n = keep.length; n >= 0; n--) {
          try {
            storage.setItem(STORE_KEY, serializeStore(store, keep.slice(0, n)));
            return dropped;
          } catch (e) {
            if (n > 0) dropped.push(keep[n - 1].id);
          }
        }

        try { storage.removeItem(STORE_KEY); } catch (e2) { /* nothing to do */ }
        return dropped;
      }

      // Private-mode Safari and a full disk both throw on every setItem, and
      // retrying a hopeless write on every turn would cost more than the chat is
      // worth. One probe at startup decides whether to try at all.
      function storageUsable(storage) {
        try {
          storage.setItem(STORE_KEY + '.probe', '1');
          storage.removeItem(STORE_KEY + '.probe');
          return true;
        } catch (e) {
          return false;
        }
      }
      // --- store:end ---

// --- markdown:begin ---
      // What the model wrote back, rendered.
      //
      // It is hand-written and small because the page ships with no
      // dependencies and is served off a phone that may have no network at all:
      // a renderer pulled from a CDN would be the one thing on the page that
      // fails. It is also, deliberately, not a complete CommonMark — it covers
      // what a small local model actually emits, and treats everything else as
      // plain text rather than guessing.
      //
      // It builds elements through the `mk` it is handed rather than reaching
      // for a global. Two things fall out of that. The block stays runnable
      // outside a browser, which is how tests/test-ui-markdown.sh can drive it
      // under node. And every piece of model text lands in a text node: nothing
      // on this page ever parses a string as markup, so the escaping is
      // structural rather than a regex that has to be right every time.
      //
      // `mk` is { createElement: fn(tag), createTextNode: fn(text) }.

      // A link the model wrote is a link the model chose. Only the three
      // schemes that mean what they say are allowed through; anything else —
      // javascript:, data:, vbscript: — is shown as text instead of becoming
      // live. Control characters are stripped first, because "java\nscript:"
      // is the same scheme to a browser as "javascript:" and a check that reads
      // the string raw would miss it.
      function safeHref(url) {
        var u = String(url == null ? '' : url).replace(/[\u0000- \u007f]+/g, '');
        if (!u) return null;
        // A browser reads a backslash as a slash in http(s) URLs, so "/\host"
        // is the same address as "//host" — the protocol-relative form the
        // check below exists to refuse. Normalised before that check rather
        // than added to it, so every later test sees what the browser will.
        u = u.replace(/\\/g, '/');
        // Protocol-relative: it is a link to somebody else's server wearing the
